name: CD Deployment

on:
  push:
    branches:
      - develop
      - main

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
      - name: Check Secret Availability
        id: check_secret
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "${SSH_KEY}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "DEPLOY_SSH_KEY not configured. Skipping automated remote deployment."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Determine Environment
        if: steps.check_secret.outputs.configured == 'true'
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "target=prod" >> $GITHUB_OUTPUT
            echo "branch=main" >> $GITHUB_OUTPUT
          else
            echo "target=dev" >> $GITHUB_OUTPUT
            echo "branch=develop" >> $GITHUB_OUTPUT
          fi

      - name: Deploy via SSH
        if: steps.check_secret.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST || '178.63.180.212' }}
          username: ${{ secrets.DEPLOY_USER || 'agyops' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            ENV="${{ steps.env.outputs.target }}"
            BRANCH="${{ steps.env.outputs.branch }}"
            TARGET_DIR="/srv/weirwise/${ENV}"
            
            echo "Deploying branch ${BRANCH} to ${TARGET_DIR} (${ENV})..."
            if [ ! -d "${TARGET_DIR}/.git" ]; then
              echo "Initializing repository in ${TARGET_DIR}..."
              mkdir -p "${TARGET_DIR}"
              git clone -b "${BRANCH}" https://github.com/ansarialireza/weirwise-rag-platform.git "${TARGET_DIR}"
            fi
            
            cd "${TARGET_DIR}"
            git fetch origin "${BRANCH}"
            git checkout "${BRANCH}"
            git reset --hard "origin/${BRANCH}"
            
            bash ./scripts/deploy.sh --env "${ENV}"
