name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-ci:
    name: Backend Lint, Typecheck & Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run Mypy Type Check
        run: mypy app

      - name: Run Pytest Suite
        run: PYTHONPATH=.. pytest -v tests

  frontend-ci:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Type Check
        run: npm run type-check

      - name: Build Next.js Application
        run: npm run build

  docker-validation:
    name: Docker Build Validation
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: weirwise-platform-backend:test

      - name: Validate Frontend Docker Build
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
          push: false
          tags: weirwise-platform-frontend:test

  deploy-dev:
    name: Deploy to Development
    needs: [docker-validation]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: development
      url: https://dev.weirwise.com
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Development via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DEPLOY_HOST || '178.63.180.212' }}
          username: ${{ vars.DEPLOY_USER || 'agyops' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            TARGET_DIR="/srv/weirwise/dev"
            echo "Deploying commit ${{ github.sha }} to ${TARGET_DIR} (dev)..."
            cd "${TARGET_DIR}"
            git fetch origin develop
            git checkout -q "${{ github.sha }}"
            bash ./scripts/deploy.sh --env dev --sha "${{ github.sha }}"

  deploy-prod:
    name: Deploy to Production
    needs: [docker-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://weirwise.com
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DEPLOY_HOST || '178.63.180.212' }}
          username: ${{ vars.DEPLOY_USER || 'agyops' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          script: |
            set -euo pipefail
            TARGET_DIR="/srv/weirwise/prod"
            echo "Deploying commit ${{ github.sha }} to ${TARGET_DIR} (prod)..."
            cd "${TARGET_DIR}"
            git fetch origin main
            git checkout -q "${{ github.sha }}"
            bash ./scripts/deploy.sh --env prod --sha "${{ github.sha }}"
