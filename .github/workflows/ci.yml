name: CI/CD Pipeline

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changed Files
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'AGENTS.md'
              - '.github/pull_request_template.md'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'AGENTS.md'
              - '.github/pull_request_template.md'
              - '.github/workflows/ci.yml'

  backend-ci:
    name: Backend Lint, Typecheck & Tests
    needs: [changes]
    if: needs.changes.outputs.backend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production-use
      ENVIRONMENT: test
      WEIRWISE_CORE_API_KEY: ci-test-key
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/requirements.txt

      - name: Install dependencies
        run: |
          uv pip install --system -r requirements.txt

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run Mypy Type Check
        run: mypy app

      - name: Validate Alembic Revision Graph
        working-directory: .
        run: |
          heads="$(alembic -c backend/alembic.ini heads)"
          printf '%s\n' "$heads"
          head_count="$(printf '%s\n' "$heads" | grep -c '(head)' || true)"
          test "$head_count" -eq 1
          python -c 'import ast, pathlib; [ast.parse(path.read_text(encoding="utf-8"), filename=str(path)) for path in pathlib.Path("backend/alembic/versions").glob("*.py")]'

      - name: Run Pytest Suite
        env:
          COVERAGE_FILE: /tmp/weirwise-platform.coverage
        run: pytest -v --tb=short --cov=app --cov-report=term-missing tests

  frontend-ci:
    name: Frontend Lint, Typecheck & Build
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: |
            frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**', 'frontend/public/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Frontend Unit Tests
        run: npm test

      - name: Run Type Check
        run: npm run type-check

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  docker-validation:
    name: Docker Build Validation
    needs: [changes, backend-ci, frontend-ci]
    if: |
      always() &&
      github.ref == 'refs/heads/main' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      (needs.backend-ci.result == 'success' || needs.backend-ci.result == 'skipped') &&
      (needs.frontend-ci.result == 'success' || needs.frontend-ci.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Docker Build
        if: needs.changes.outputs.backend == 'true' || github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: weirwise-platform-backend:test
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Validate Frontend Docker Build
        if: needs.changes.outputs.frontend == 'true' || github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
          push: false
          tags: weirwise-platform-frontend:test
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  deploy-dev:
    name: Deploy to Development
    needs: [changes, backend-ci, frontend-ci]
    if: |
      always() &&
      github.ref == 'refs/heads/develop' &&
      github.event_name == 'push' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    environment:
      name: development
      url: https://dev.weirwise.com
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Development via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DEPLOY_HOST || '178.63.180.212' }}
          username: ${{ vars.DEPLOY_USER || 'agyops' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            TARGET_DIR="/srv/weirwise/dev"
            echo "Deploying commit ${{ github.sha }} to ${TARGET_DIR} (dev)..."
            cd "${TARGET_DIR}"
            git reset --hard HEAD
            git clean -fd
            git fetch origin develop
            git checkout -f -q "${{ github.sha }}"
            bash ./scripts/deploy.sh --env dev --sha "${{ github.sha }}"

  deploy-prod:
    name: Deploy to Production
    needs: [docker-validation]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://weirwise.com
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Production via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.DEPLOY_HOST || '178.63.180.212' }}
          username: ${{ vars.DEPLOY_USER || 'agyops' }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT || 22 }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            TARGET_DIR="/srv/weirwise/prod"
            echo "Deploying commit ${{ github.sha }} to ${TARGET_DIR} (prod)..."
            cd "${TARGET_DIR}"
            git reset --hard HEAD
            git clean -fd
            git fetch origin main
            git checkout -f -q "${{ github.sha }}"
            bash ./scripts/deploy.sh --env prod --sha "${{ github.sha }}"
            echo "Executing automated post-deployment garbage collection..."
            docker system prune -a -f
            docker builder prune -a -f
