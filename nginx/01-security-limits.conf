# ==============================================================================
# Weirwise Global Security & Rate Limiting Directives
# ==============================================================================

# Rate limiting zones:
# 1. API zone: 30 req/sec per client IP with burst 50
# 2. Auth zone: 5 req/sec per client IP with burst 10
limit_req_zone $binary_remote_addr zone=weirwise_api_zone:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=weirwise_auth_zone:10m rate=5r/s;

# Return HTTP 429 Too Many Requests when rate limit is exceeded
limit_req_status 429;

# Docker Internal DNS resolver with 10s TTL for dynamic container IP resolution
resolver 127.0.0.11 valid=10s ipv6=off;
