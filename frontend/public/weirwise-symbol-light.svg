<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" role="img" aria-labelledby="title desc">
  <title id="title">Weirwise symbol</title>
  <desc id="desc">Flowing W monogram built from three parallel graphite ribbons and blades with a deep-cyan accent for light surfaces.</desc>
  <defs>
    <linearGradient id="lightSilver" x1="60" y1="60" x2="780" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A3D42"/>
      <stop offset="0.5" stop-color="#26282C"/>
      <stop offset="1" stop-color="#141518"/>
    </linearGradient>
    <linearGradient id="lightBlade" x1="500" y1="60" x2="860" y2="548" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#202124"/>
      <stop offset="0.45" stop-color="#101114"/>
      <stop offset="1" stop-color="#0A0B0D"/>
    </linearGradient>
    <clipPath id="lightPeak">
      <path d="M 0 0 H 470 L 520 342 V 560 H 0 Z"/>
    </clipPath>
  </defs>
  <g clip-path="url(#lightPeak)" fill="none" stroke="url(#lightSilver)" stroke-width="58" stroke-linecap="butt">
    <path d="M 40 110 H 110 C 210 110 225 310 310 330 C 390 350 440 190 500 70"/>
    <path d="M 40 205 H 110 C 210 205 225 405 310 425 C 390 445 435 285 495 175"/>
    <path d="M 40 300 H 110 C 210 300 225 500 310 520 C 390 540 430 380 490 280"/>
  </g>
  <path fill="#C5C9CE" d="M 505 342 L 545 300 L 592 548 L 505 548 Z"/>
  <path fill="url(#lightBlade)" d="M 500 548 L 630 120 L 700 120 L 605 548 Z"/>
  <path fill="url(#lightBlade)" d="M 655 548 L 740 55 L 800 108 L 720 548 Z"/>
  <path d="M 470 54 L 520 342" fill="none" stroke="#0E7A86" stroke-width="12" stroke-linecap="round"/>
  <path d="M 742 60 L 658 548" fill="none" stroke="#0E7A86" stroke-width="12" stroke-linecap="round"/>
</svg>
