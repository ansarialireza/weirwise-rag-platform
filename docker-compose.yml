version: '3.8'

services:
  platform-db:
    image: postgres:16-alpine
    container_name: weirwise-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-weirwise_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weirwise_platform_pass}
      POSTGRES_DB: ${POSTGRES_DB:-weirwise_platform_db}
    ports:
      - "5432:5432"
    volumes:
      - platform_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-weirwise_platform} -d ${POSTGRES_DB:-weirwise_platform_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  platform-redis:
    image: redis:7-alpine
    container_name: weirwise-platform-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - platform_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  platform-minio:
    image: minio/minio:latest
    container_name: weirwise-platform-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - platform_minio_data:/data

volumes:
  platform_postgres_data:
  platform_redis_data:
  platform_minio_data:
