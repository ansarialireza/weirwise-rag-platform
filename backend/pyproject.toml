[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "weirwise-platform-backend"
version = "0.1.0"
description = "Weirwise Platform - Enterprise Multi-tenant AI Assistant & Knowledge Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "redis>=5.0.2",
    "celery>=5.3.6",
    "pyjwt>=2.8.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
disable_error_code = ["arg-type", "assignment", "var-annotated"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Standard rule selection: pycodestyle (E, W), Pyflakes (F), isort (I)
# B008 is ignored because FastAPI dependency injection idiomatically uses Depends() in route defaults
select = ["E", "F", "W", "I"]
ignore = ["B008"]
